<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cmux</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>cmux</h1>
          <p id="connectionText"></p>
          <p id="notificationText"></p>
        </div>
        <button id="closeConnection" class="icon-button" data-i18n-aria="disconnect">X</button>
      </header>

      <section id="pairingView" class="screen">
        <div class="section-header">
          <h2 data-i18n="pair.title"></h2>
          <p data-i18n="pair.subtitle"></p>
        </div>
        <button id="backToWorkspacesFromPairing" class="hidden" data-i18n="workspaces.title"></button>
        <label>
          <span data-i18n="pair.link"></span>
          <textarea id="pairingCode" rows="4" autocomplete="off" data-i18n-placeholder="pair.placeholder"></textarea>
        </label>
        <div class="pair-actions">
          <button id="scanPairingCode" data-i18n="pair.scan"></button>
          <button id="pairButton" class="primary" data-i18n="pair.connect"></button>
        </div>

        <section class="auth-panel" aria-labelledby="authTitle">
          <div class="section-header">
            <h3 id="authTitle" data-i18n="auth.title"></h3>
            <p id="authStatusText"></p>
          </div>
          <label>
            <span data-i18n="auth.token"></span>
            <textarea id="stackAccessToken" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="auth.placeholder"></textarea>
          </label>
          <div class="auth-actions">
            <button id="startStackSignIn" class="primary" data-i18n="auth.signIn"></button>
            <button id="saveStackAccessToken" data-i18n="auth.save"></button>
            <button id="clearStackAccessToken" data-i18n="auth.clear"></button>
          </div>
        </section>

        <div id="pairedList" class="paired-list"></div>
      </section>

      <section id="workspaceView" class="screen hidden">
        <div class="section-header row">
          <div>
            <h2 data-i18n="workspaces.title"></h2>
            <p id="hostText"></p>
          </div>
          <div class="section-actions">
            <button id="createWorkspace" data-i18n="workspace.new"></button>
            <button id="showPairedMacs" data-i18n="paired.manage"></button>
            <button id="enableNotifications" class="hidden" data-i18n="notification.enable"></button>
            <button id="syncNotifications" data-i18n="notification.sync"></button>
            <button id="dismissNotifications" data-i18n="notification.dismissAll"></button>
            <button id="refreshWorkspaces" data-i18n="refresh"></button>
          </div>
        </div>
        <input id="workspaceSearch" class="workspace-search" type="search" autocomplete="off" data-i18n-placeholder="workspace.searchPlaceholder" data-i18n-aria="workspace.searchLabel" />
        <div id="workspaceFilters" class="filter-bar" role="group" data-i18n-aria="workspace.filterLabel">
          <button class="filter-active" data-workspace-filter="all" data-i18n="workspace.filterAll"></button>
          <button data-workspace-filter="unread" data-i18n="workspace.filterUnread"></button>
          <button data-workspace-filter="pinned" data-i18n="workspace.filterPinned"></button>
        </div>
        <div id="workspaceList" class="workspace-list"></div>
      </section>

      <section id="terminalView" class="screen hidden">
        <div class="terminal-toolbar">
          <button id="backToWorkspaces" data-i18n="back"></button>
          <div>
            <strong id="terminalTitle"></strong>
            <span id="terminalMeta"></span>
          </div>
          <button id="copyTerminalOutput" data-i18n="copy"></button>
          <button id="refreshTerminal" data-i18n="replay"></button>
        </div>
        <pre id="terminalOutput" class="terminal-output"></pre>
        <div class="terminal-scroll-actions">
          <button id="scrollUp" data-i18n="scroll.up"></button>
          <button id="scrollDown" data-i18n="scroll.down"></button>
        </div>
        <div class="terminal-keybar" data-i18n-aria="terminal.keys">
          <button data-terminal-key="enter" data-i18n="terminal.key.enter"></button>
          <button data-terminal-key="tab" data-i18n="terminal.key.tab"></button>
          <button data-terminal-key="escape" data-i18n="terminal.key.escape"></button>
          <button data-terminal-key="backspace" data-i18n="terminal.key.backspace"></button>
          <button data-terminal-key="ctrl-a" data-i18n="terminal.key.ctrlA"></button>
          <button data-terminal-key="ctrl-c" data-i18n="terminal.key.ctrlC"></button>
          <button data-terminal-key="ctrl-d" data-i18n="terminal.key.ctrlD"></button>
          <button data-terminal-key="ctrl-e" data-i18n="terminal.key.ctrlE"></button>
          <button data-terminal-key="ctrl-l" data-i18n="terminal.key.ctrlL"></button>
          <button data-terminal-key="ctrl-u" data-i18n="terminal.key.ctrlU"></button>
          <button data-terminal-key="ctrl-w" data-i18n="terminal.key.ctrlW"></button>
          <button data-terminal-key="ctrl-z" data-i18n="terminal.key.ctrlZ"></button>
          <button data-terminal-key="arrow-up" data-i18n="terminal.key.arrowUp"></button>
          <button data-terminal-key="arrow-down" data-i18n="terminal.key.arrowDown"></button>
          <button data-terminal-key="arrow-left" data-i18n="terminal.key.arrowLeft"></button>
          <button data-terminal-key="arrow-right" data-i18n="terminal.key.arrowRight"></button>
          <button data-terminal-key="home" data-i18n="terminal.key.home"></button>
          <button data-terminal-key="end" data-i18n="terminal.key.end"></button>
          <button data-terminal-key="page-up" data-i18n="terminal.key.pageUp"></button>
          <button data-terminal-key="page-down" data-i18n="terminal.key.pageDown"></button>
        </div>
        <div class="composer">
          <textarea id="terminalInput" rows="3" data-i18n-placeholder="terminal.inputPlaceholder"></textarea>
          <input id="imageInput" class="hidden-file-input" type="file" accept="image/*" />
          <div class="composer-actions">
            <button id="pasteInput" data-i18n="paste"></button>
            <button id="pasteImage" data-i18n="image.paste"></button>
            <button id="clearTerminalInput" data-i18n="clear"></button>
            <button id="sendInput" class="primary" data-i18n="send"></button>
          </div>
        </div>
      </section>

      <section class="event-strip">
        <div id="toast"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
